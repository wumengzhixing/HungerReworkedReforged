# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Build Release

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src/generated
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle
      - uses: actions/checkout@v4
      - uses: BrycensRanch/read-properties-action@v1
        id: version
        with:
          file: gradle.properties
          property: mod_version
          default: 1.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'liberica'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Smoke test with game test server
        run: ./gradlew runGameTestServer
        timeout-minutes: 10
      - name: Generate JaCoCo coverage report
        run: ./gradlew test jacocoTestReport
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{github.sha}}
          path: build/reports/jacoco/test/html/
      - name: Upload binaries to release
        uses: actions/upload-artifact@v4
        with:
          name: hunger_reworked_reforged-${{steps.version.outputs.value}}-${{github.sha}}.jar
          path: build/libs/hunger_reworked_reforged-${{steps.version.outputs.value}}.jar
      - name: Upload sources to release
        uses: actions/upload-artifact@v4
        with:
          name: hunger_reworked_reforged-${{steps.version.outputs.value}}-${{github.sha}}-sources.jar
          path: build/libs/hunger_reworked_reforged-${{steps.version.outputs.value}}-sources.jar
